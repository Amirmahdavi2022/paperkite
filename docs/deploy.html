<h1>paperkite</h1>
<p class="sub">Deploy straight from this page, signed by your own wallet. Nothing here holds your key.</p>

<section>
  <h2>1. connect</h2>
  <button id="connect">Connect wallet</button>
  <div id="connectStatus" class="status"></div>
</section>

<section>
  <h2>2. deploy the renderer</h2>
  <button id="deployRenderer" disabled>Deploy Paperkite renderer</button>
  <div id="rendererStatus" class="status"></div>
</section>

<section>
  <h2>3. deploy the collection</h2>
  <label>Renderer address</label>
  <input id="rendererAddr" placeholder="0x...">
  <label>Payout / owner address</label>
  <input id="payoutAddr" value="0xc3491296a9093F09aD7f0db0B394457262150af8">

  <input id="priceEth" value="0.001">
  <label>Max supply</label>
  <input id="maxSupply" value="512">
  <button id="deployNft" disabled>Deploy PaperkiteNFT</button>
  <div id="nftStatus" class="status"></div>
</section>

<section>
  <h2>4. mint one to yourself</h2>
  <label>NFT contract address</label>
  <input id="mintAddr" placeholder="0x...">
  <label>Price per mint (ETH)</label>
  <input id="mintPriceEth" value="0.001">
  <button id="mintBtn" disabled>Mint</button>
  <div id="mintStatus" class="status"></div>
</section>

<section>
  <h2>5. check a token</h2>
  <label>NFT contract address</label>
  <input id="checkAddr" placeholder="0x...">
  <label>Token id</label>
  <input id="checkId" value="1">
  <button id="checkBtn" disabled>Show token</button>
  <div id="checkStatus" class="status"></div>
  <img id="checkImg" class="preview" style="display:none">
</section>

let provider, signer;

function setStatus(id, text, cls) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'status' + (cls ? ' ' + cls : '');
}

document.getElementById('connect').onclick = async () => {
  if (!window.ethereum) {
    setStatus('connectStatus', 'No wallet found. Open this page inside your wallet app\'s own browser (MetaMask or Rainbow), not your regular browser.', 'err');
    return;
  }
  try {
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send('eth_requestAccounts', []);
    signer = await provider.getSigner();
    const addr = await signer.getAddress();
    const net = await provider.getNetwork();
    document.getElementById('network').textContent = 'connected: ' + addr.slice(0,6) + '…' + addr.slice(-4) + '  ·  chain ' + net.chainId + ' (' + (net.name || 'unknown') + ')';
    setStatus('connectStatus', 'connected', 'ok');
    document.getElementById('deployRenderer').disabled = false;
    document.getElementById('deployNft').disabled = false;
    document.getElementById('mintBtn').disabled = false;
    document.getElementById('checkBtn').disabled = false;
  } catch (e) {
    setStatus('connectStatus', 'failed: ' + (e.message || e), 'err');
  }
};

document.getElementById('deployRenderer').onclick = async () => {
  setStatus('rendererStatus', 'confirm in your wallet…', 'pending');
  try {
    const factory = new ethers.ContractFactory(RENDERER_ABI, RENDERER_BYTECODE, signer);
    const contract = await factory.deploy();
    setStatus('rendererStatus', 'sent, waiting for it to be mined…', 'pending');
    await contract.waitForDeployment();
    const addr = await contract.getAddress();
    setStatus('rendererStatus', 'deployed at ' + addr, 'ok');
    document.getElementById('rendererAddr').value = addr;
  } catch (e) {
    setStatus('rendererStatus', 'failed: ' + (e.reason || e.message || e), 'err');
  }
};

document.getElementById('deployNft').onclick = async () => {
  const rendererAddr = document.getElementById('rendererAddr').value.trim();
  const payoutAddr = document.getElementById('payoutAddr').value.trim();
  const priceEth = document.getElementById('priceEth').value.trim();
  const maxSupply = document.getElementById('maxSupply').value.trim();
  if (!ethers.isAddress(rendererAddr)) { setStatus('nftStatus', 'renderer address looks wrong', 'err'); return; }
  if (!ethers.isAddress(payoutAddr)) { setStatus('nftStatus', 'payout address looks wrong', 'err'); return; }
  setStatus('nftStatus', 'confirm in your wallet…', 'pending');
  try {
    const priceWei = ethers.parseEther(priceEth);
    const factory = new ethers.ContractFactory(NFT_ABI, NFT_BYTECODE, signer);
    const contract = await factory.deploy(rendererAddr, payoutAddr, priceWei, BigInt(maxSupply));
    setStatus('nftStatus', 'sent, waiting for it to be mined…', 'pending');
    await contract.waitForDeployment();
    const addr = await contract.getAddress();
    setStatus('nftStatus', 'deployed at ' + addr, 'ok');
    document.getElementById('mintAddr').value = addr;
    document.getElementById('checkAddr').value = addr;
    document.getElementById('mintPriceEth').value = priceEth;
  } catch (e) {
    setStatus('nftStatus', 'failed: ' + (e.reason || e.message || e), 'err');
  }
};

document.getElementById('mintBtn').onclick = async () => {
  const addr = document.getElementById('mintAddr').value.trim();
  const priceEth = document.getElementById('mintPriceEth').value.trim();
  if (!ethers.isAddress(addr)) { setStatus('mintStatus', 'contract address looks wrong', 'err'); return; }
  setStatus('mintStatus', 'confirm in your wallet…', 'pending');
  try {
    const contract = new ethers.Contract(addr, NFT_ABI, signer);
    const tx = await contract.mint({ value: ethers.parseEther(priceEth) });
    setStatus('mintStatus', 'sent, waiting for it to be mined…', 'pending');
    const receipt = await tx.wait();
    setStatus('mintStatus', 'minted. tx: ' + receipt.hash, 'ok');
    document.getElementById('checkAddr').value = addr;
  } catch (e) {
    setStatus('mintStatus', 'failed: ' + (e.reason || e.message || e), 'err');
  }
};

document.getElementById('checkBtn').onclick = async () => {
  const addr = document.getElementById('checkAddr').value.trim();
  const id = document.getElementById('checkId').value.trim();
  if (!ethers.isAddress(addr)) { setStatus('checkStatus', 'contract address looks wrong', 'err'); return; }
  setStatus('checkStatus', 'reading…', 'pending');
  document.getElementById('checkImg').style.display = 'none';
  try {
    const contract = new ethers.Contract(addr, NFT_ABI, provider);
    const uri = await contract.tokenURI(BigInt(id));
    const json = JSON.parse(atob(uri.split(',')[1]));
    setStatus('checkStatus', json.name + '\n' + json.attributes[0].value, 'ok');
    const img = document.getElementById('checkImg');
    img.src = json.image;
    img.style.display = 'block';
  } catch (e) {
    setStatus('checkStatus', 'failed: ' + (e.reason || e.message || e), 'err');
  }
};
</script>
